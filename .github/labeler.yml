# Auto-label PRs based on changed files (actions/labeler v6 format)

documentation:
  - changed-files:
    - any-glob-to-any-file:
      - 'docs/**/*'
      - '*.md'
      - 'README.md'

dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - 'Cargo.toml'
      - 'Cargo.lock'

ci:
  - changed-files:
    - any-glob-to-any-file: '.github/**/*'

tests:
  - changed-files:
    - any-glob-to-any-file: 'tests/**/*'

examples:
  - changed-files:
    - any-glob-to-any-file: 'examples/**/*'

source:
  - changed-files:
    - any-glob-to-any-file: 'src/**/*'
